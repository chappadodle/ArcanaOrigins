modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/chappadodle/ArcanaOrigins/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="chappadodle"
description='''
Elemental magic as Origins: pick Fire, Water, Ice, Wind, Earth, Crystal, Lightning or Radiance as your origin and you simply have its magic. Three spells on your skill keys, passives and a weakness for each; no mana, no levels, no items. An addon for NeoOrigins, made from Elemental Arcana's spells.
'''
displayURL="https://github.com/chappadodle/ArcanaOrigins"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoorigins"
    type="required"
    versionRange="[2.2.29,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="veil"
    type="optional"
    versionRange="[4.5,)"
    ordering="NONE"
    side="CLIENT"
